<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic Code Intelligence</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><div class="eyebrow">LOCAL CODE SEARCH</div><h1>Agentic Code Intelligence</h1><p>Natural Language → Relevant Code Retrieval</p></header><section class="panel"><h2>Codebase</h2><label for="path">Codebase folder path</label><div class="row"><input id="path" value="data/sample_code" placeholder="./path/to/source"><button id="build">Build / Rebuild Index</button></div><div id="status" class="status">Index status: Not built</div></section><section class="panel"><h2>Search</h2><textarea id="query" placeholder="Ask about the codebase..."></textarea><div class="filter-row"><label class="check"><input type="checkbox" id="exact-enabled"> Require a word in the code</label><input id="exact-word" placeholder="e.g. AI" maxlength="120" disabled></div><div class="row"><select id="topk"><option>5</option><option>10</option><option>20</option></select><button id="search">Search Code</button><span id="latency"></span></div></section><section id="results"></section><footer>Runs locally on your machine. Search returns source code snippets; it does not generate answers.</footer></main><script src="/static/app.js"></script></body></html>
